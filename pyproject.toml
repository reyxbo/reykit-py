[project]
name = "reykit"
version = "1.2.87"
description = "General-purpose utility method integration package."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = [
    "rey",
    "reyxbo",
    "kit",
    "dll-injection",
    "email",
    "image",
    "log",
    "net",
    "os",
    "random",
    "regex",
    "schedule",
    "stdout",
    "system",
    "table",
    "thread",
    "async",
    "text",
    "time",
    "decorator"
]
authors = [
    {name = "Rey", email = "reyxbo@163.com"}
]
dependencies = [
    "aiohttp",
    "apscheduler",
    "bcrypt",
    "captcha",
    "concurrent-log-handler",
    "filetype",
    "pandas",
    "pyzbar",
    "pdfplumber",
    "psutil",
    "pymem",
    "python-docx",
    "qrcode",
    "requests",
    "requests_cache",
    "reydb",
    "varname",
    "Pillow",
    "PyJWT"
]

[project.urls]
Homepage = "https://www.reyxbo.com/release/python/reykit"
Repository = "https://github.com/reyxbo/reykit-py.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
